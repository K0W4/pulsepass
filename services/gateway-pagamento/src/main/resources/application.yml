server:
  port: ${PORT:8090}
spring:
  application:
    name: gateway-pagamento
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
logging:
  structured:
    format:
      console: ecs
gateway:
  modo: ${GATEWAY_MODO:APROVAR}
  atraso-ms: ${GATEWAY_ATRASO_MS:0}
  falhar: ${GATEWAY_FALHAR:false}
