server:
  port: 8080
spring:
  application:
    name: api-gateway
  reactor:
    context-propagation: auto
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/realms/pulsepass/protocol/openid-connect/certs}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: inventario
              uri: ${INVENTARIO_URL:http://localhost:8082}
              predicates:
                - Path=/api/eventos/**,/api/reservas/**
              filters:
                - StripPrefix=1
            - id: checkout
              uri: ${CHECKOUT_URL:http://localhost:8083}
              predicates:
                - Path=/api/pedidos/**,/api/pagamentos/**
              filters:
                - StripPrefix=1
            - id: emissao
              uri: ${EMISSAO_URL:http://localhost:8084}
              predicates:
                - Path=/api/ingressos/**,/api/validacoes/**
              filters:
                - StripPrefix=1
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
logging:
  structured:
    format:
      console: ecs
