# Ambiente completo: docker compose up --wait   (RNF19)
name: pulsepass

x-servico: &servico
  restart: unless-stopped

x-saude: &saude
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 20s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsepass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsepass-dev}
      POSTGRES_DB: postgres
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsepass}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION:-1}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_REPLICATION:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.8.0
    entrypoint: ["/bin/sh", "/criar-topicos.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_REPLICATION: ${KAFKA_REPLICATION:-1}
    volumes:
      - ./infra/kafka/criar-topicos.sh:/criar-topicos.sh:ro
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pulsepass
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka: { condition: service_healthy }

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./infra/keycloak/pulsepass-realm.json:/opt/keycloak/data/import/pulsepass-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  gateway-pagamento:
    build: { context: ., dockerfile: infra/Dockerfile.service, args: { MODULE: gateway-pagamento } }
    environment:
      PORT: 8090
    healthcheck:
      <<: *saude
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/actuator/health"]

  inventario-service:
    <<: *servico
    build: { context: ., dockerfile: infra/Dockerfile.service, args: { MODULE: inventario-service } }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/db_inventario
      DB_USER: ${POSTGRES_USER:-pulsepass}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pulsepass-dev}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:19092
      JWK_SET_URI: http://keycloak:8080/realms/pulsepass/protocol/openid-connect/certs
    healthcheck:
      <<: *saude
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]

  checkout-service:
    <<: *servico
    build: { context: ., dockerfile: infra/Dockerfile.service, args: { MODULE: checkout-service } }
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      gateway-pagamento: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/db_checkout
      DB_USER: ${POSTGRES_USER:-pulsepass}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pulsepass-dev}
      KAFKA_BOOTSTRAP: kafka:19092
      JWK_SET_URI: http://keycloak:8080/realms/pulsepass/protocol/openid-connect/certs
      GATEWAY_PAGAMENTO_URL: http://gateway-pagamento:8090
    healthcheck:
      <<: *saude
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]

  emissao-service:
    <<: *servico
    build: { context: ., dockerfile: infra/Dockerfile.service, args: { MODULE: emissao-service } }
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/db_emissao
      DB_USER: ${POSTGRES_USER:-pulsepass}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pulsepass-dev}
      KAFKA_BOOTSTRAP: kafka:19092
      JWK_SET_URI: http://keycloak:8080/realms/pulsepass/protocol/openid-connect/certs
      EMISSAO_QR_SECRET: ${EMISSAO_QR_SECRET:-dev-only-secret-change-me-0123456789abcdef}
    healthcheck:
      <<: *saude
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]

  api-gateway:
    build: { context: ., dockerfile: infra/Dockerfile.service, args: { MODULE: api-gateway } }
    ports:
      - "8080:8080"
    depends_on:
      keycloak: { condition: service_healthy }
      inventario-service: { condition: service_healthy }
      checkout-service: { condition: service_healthy }
      emissao-service: { condition: service_healthy }
    environment:
      JWK_SET_URI: http://keycloak:8080/realms/pulsepass/protocol/openid-connect/certs
      INVENTARIO_URL: http://inventario-service:8080
      CHECKOUT_URL: http://checkout-service:8080
      EMISSAO_URL: http://emissao-service:8080
    healthcheck:
      <<: *saude
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]

volumes:
  pgdata:
