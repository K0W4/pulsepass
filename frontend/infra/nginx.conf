server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # WebSocket (tempo real): precisa do Upgrade e de um tempo de leitura maior; o servidor manda um
  # ping a cada 25 s, então a conexão nunca fica ociosa por 60 s
  location /api/realtime/ {
    proxy_pass http://api-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  # a SPA fala só com o gateway, no mesmo domínio (sem CORS)
  location /api/ {
    proxy_pass http://api-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  location = /config.js { add_header Cache-Control "no-store"; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
